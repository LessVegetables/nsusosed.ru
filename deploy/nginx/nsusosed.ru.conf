# nsusosed.ru on the host nginx.
# Install:  /etc/nginx/sites-available/nsusosed.ru
#           ln -s ../sites-available/nsusosed.ru /etc/nginx/sites-enabled/
# Needs the Let's Encrypt cert first (see deploy/README.md), or `nginx -t` fails.
#
# Static files: /var/www/nsusosed.ru   (rsynced from frontend/ by the workflow)
# API:          127.0.0.1:1231         (docker compose stack, deploy/compose.yaml)

# This file is included inside http {}, so the zone lives at http level.
# A coarse flood guard in front of the backend's own per-IP limits.
limit_req_zone $binary_remote_addr zone=nsusosed_auth:10m rate=10r/m;

upstream nsusosed_api {
    server 127.0.0.1:1231;
    keepalive 8;
}

# http → https, www → apex
server {
    listen 80;
    listen [::]:80;
    server_name nsusosed.ru www.nsusosed.ru;

    return 301 https://nsusosed.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nsusosed.ru;

    ssl_certificate     /etc/letsencrypt/live/nsusosed.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nsusosed.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://nsusosed.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1+. On older nginx (e.g. Ubuntu 24.04's 1.24) delete this line
    # and write "listen 443 ssl http2;" above instead.
    http2 on;
    server_name nsusosed.ru;

    ssl_certificate     /etc/letsencrypt/live/nsusosed.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nsusosed.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/nsusosed.ru;
    index index.html;

    access_log /var/log/nginx/nsusosed.ru.access.log;
    error_log  /var/log/nginx/nsusosed.ru.error.log warn;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Headers stay at server level: any add_header inside a location would
    # silently drop all of these for that location.
    # No build step → no hashed file names → browsers revalidate (cheap 304s).
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── API ───────────────────────────────────────────────
    # Same origin as the pages, so the __Host- cookie and the Origin check work.
    location /api/ {
        proxy_pass http://nsusosed_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # $remote_addr, not $proxy_add_x_forwarded_for: we are the edge, so
        # never pass along an X-Forwarded-For the client made up.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        client_max_body_size 64k;
    }

    location /api/auth/ {
        limit_req zone=nsusosed_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nsusosed_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        client_max_body_size 64k;
    }

    # ── Pages ─────────────────────────────────────────────
    # /matches → matches.html, /listing?id=… → listing.html, / → index.html.
    # No SPA fallback: every page is its own file, anything else is a 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    # Dotfiles, just in case one ever lands in the web root.
    location ~ /\. {
        return 404;
    }
}
