# Locks down the GitHub Actions login.
# Install: sudo install -m 644 -o root -g root gh_deploy.conf /etc/ssh/sshd_config.d/gh_deploy.conf
#          sudo sshd -t && sudo systemctl reload ssh
#
# A Match block runs to the end of the file, so nothing goes below it.
# Check it applies to gh_deploy only (see deploy/README.md, step 3):
#   sudo sshd -T -C user=gh_deploy,host=x,addr=192.0.2.1 | grep -i forcecommand
#   sudo sshd -T -C user=root,host=x,addr=192.0.2.1      | grep -i forcecommand   # → none

Match User gh_deploy
    # The key lives in a root-owned file, so gh_deploy can't add keys of its own.
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no

    PermitTTY no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no

    # Every command goes through the allowlist.
    ForceCommand /usr/local/bin/gh-deploy-gate
