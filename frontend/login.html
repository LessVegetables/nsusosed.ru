<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.login">Вход — nsusosed</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/pages/login.js"></script>
  <script defer src="https://stat.gehrman.me/script.js" data-website-id="f973f006-b658-4987-8813-7fb6acf879c5" data-exclude-hash="true"></script>
  <script defer src="https://stat.gehrman.me/recorder.js" data-website-id="f973f006-b658-4987-8813-7fb6acf879c5"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Перейти к содержимому</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">nsusosed</a>
      <nav class="site-nav" aria-label="Основное меню" data-i18n-attr="aria-label:nav.label">
        <ul>
          <li data-show="seeker" hidden><a href="/matches" data-i18n="nav.matches">Подборка</a></li>
          <li data-show="host" hidden><a href="/home" data-i18n="nav.home">Моё жильё</a></li>
          <li data-show="seeker host" hidden><a href="/questionnaire" data-i18n="nav.questionnaire">Анкета</a></li>
          <li data-show="seeker host onboarding" hidden><a href="/account" data-i18n="nav.account">Аккаунт</a></li>
          <li data-show="guest" hidden><a href="/login" data-i18n="nav.login" aria-current="page">Войти</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container narrow" tabindex="-1">
    <h1 data-i18n="login.title">Вход и регистрация</h1>

    <section id="step-email" aria-labelledby="step-email-title">
      <h2 id="step-email-title" class="visually-hidden" data-i18n="login.stepEmail">Почта</h2>
      <p class="lead" data-i18n="login.lead">Паролей нет: мы пришлём на почту одноразовый код.</p>
      <form id="email-form" class="stack" novalidate>
        <div class="field" data-field="email">
          <label for="email" data-i18n="login.email">Университетская почта</label>
          <input id="email" type="email" autocomplete="email" inputmode="email"
                 autocapitalize="off" spellcheck="false" maxlength="254" required
                 aria-describedby="email-hint" placeholder="i.ivanov@g.nsu.ru">
          <p id="email-hint" class="hint" data-i18n="login.emailHint">Только адреса @g.nsu.ru.</p>
        </div>
        <div class="field field-check" data-field="privacy_accepted">
          <input id="privacy" type="checkbox" required>
          <label for="privacy">
            <span data-i18n="login.privacyBefore">Я согласен(на) с</span>
            <a href="/privacy" target="_blank" rel="noopener" data-i18n="login.privacyLink">политикой обработки персональных данных</a>
          </label>
        </div>
        <div id="email-error" hidden></div>
        <div class="actions">
          <button class="btn" type="submit" disabled data-i18n="login.getCode">Получить код</button>
        </div>
      </form>
    </section>

    <section id="step-code" aria-labelledby="step-code-title" hidden>
      <h2 id="step-code-title" class="visually-hidden" data-i18n="login.stepCode">Код из письма</h2>
      <p id="code-sent" class="lead" role="status" data-private></p>
      <form id="code-form" class="stack" novalidate>
        <div class="field" data-field="code">
          <label for="code" data-i18n="login.code">Код из письма (6 цифр)</label>
          <input id="code" class="input-code" inputmode="numeric" autocomplete="one-time-code"
                 pattern="[0-9]{6}" maxlength="6" required aria-describedby="code-timer">
          <p id="code-timer" class="hint"></p>
        </div>
        <div id="code-error" hidden></div>
        <div class="actions">
          <button class="btn" type="submit" disabled data-i18n="login.submit">Войти</button>
        </div>
        <div class="actions">
          <button id="resend" class="btn btn-link" type="button"></button>
          <button id="change-email" class="btn btn-link" type="button" data-i18n="login.changeEmail">Изменить почту</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p data-i18n="footer.tagline">nsusosed.ru — подбор соседей для студентов НГУ</p>
      <p><a href="/privacy" data-i18n="footer.privacy">Политика обработки персональных данных</a></p>
    </div>
  </footer>
</body>
</html>
