# Every push and pull request: frontend unit tests, backend tests, and the browser tests.
# How to run the same locally: tests/README.md.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Translations and syntax
        run: |
          python3 frontend/tools/check_i18n.py
          for f in frontend/js/*.js frontend/js/pages/*.js frontend/js/i18n/*.js; do node --input-type=module --check < "$f" || { echo "::error::syntax error in $f"; exit 1; }; done
      - name: Unit tests
        run: node --test 'tests/frontend/*.test.js'

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nsusosed
          POSTGRES_PASSWORD: nsusosed
          POSTGRES_DB: nsusosed_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nsusosed" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://nsusosed:nsusosed@localhost:5432/nsusosed_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest
        working-directory: backend

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nsusosed
          POSTGRES_PASSWORD: nsusosed
          POSTGRES_DB: nsusosed_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nsusosed" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://nsusosed:nsusosed@localhost:5432/nsusosed_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/e2e/requirements.txt
      - run: pip install -r tests/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e --tracing retain-on-failure --output test-results
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
